# ISO DIS document metadata — Era C (late Typefi)
#
# Single source of truth for ISO-specific document abbreviations used in
# docProps/custom.xml by the Typefi publishing pipeline.
#
# Template era:    late_typefi
# Reference DOCX:  spec/fixtures/20250530-ISO_DIS_15926-100.docx
# Loaded by:       IsoDoc::Iso::Docx::DocumentProperties

doctype_abbreviations:
  international-standard: IS
  technical-specification: TS
  technical-report: TR
  publicly-available-specification: PAS
  international-workshop-agreement: IWA
  guide: Guide
  amendment: AMD
  technical-corrigendum: COR

stage_abbreviations:
  # Note: DocumentProperties.release_version buckets the stage value via
  # `stage / 10 * 10`, so only decile-bucketed entries (0, 10, ..., 60, 90)
  # are reachable through lookup. The 95 => "COR" entry is preserved for
  # documentation — it reflects the ISO stage code for technical
  # corrigenda, but is unreachable because stage 95 buckets to 90 ("AMD").
  0: PWI
  10: NP
  20: WD
  30: CD
  40: DIS
  50: FDIS
  60: IS
  90: AMD
  95: COR
