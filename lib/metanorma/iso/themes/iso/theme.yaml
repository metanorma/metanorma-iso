# Default ISO HTML theme: the house style of the consolidated ISO/IEC
# Directives online edition (iso.org/sites/directives). ISO/IEC Directives,
# Part 2, Clause 1 leaves typography and layout to the publisher's house
# style; the structural rules (numbering, labels, caption placement) come
# from the presentation XML. Element styles for the document body are in
# custom.css next to this file. The previous default is ../iso-legacy.

# Palette
primary: "#0b5aa2"
accent: "#0b5aa2"
accent_deep: "#094a86"
gradient: "linear-gradient(135deg, #094a86 0%, #0b5aa2 100%)"
primary_light: "#eaf2f9"
accent_light: "#eaf2f9"
primary_dark: "#094a86"
warm: "#c8102e"
warm_light: "#fdf3f4"

# Text and backgrounds
text_color: "#1a1d21"
text_light: "#454b52"
text_muted: "#6b7280"
bg: "#ffffff"
bg_light: "#f6f8fa"
border: "#e3e6ea"
sidebar_bg: "#fbfcfd"

# Typography: one sans-serif stack for body and headings, as on the
# Directives site. Roboto is loaded as the fallback where Segoe UI is absent.
font_body: '"Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif'
font_sans: '"Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif'
font_url: "https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500&display=swap"

# Layout
content_max_width: "60em"
sidebar_width: "340px"

# Blocks: notes and examples are plain small text (see custom.css)
note_color: "#6b7280"
note_bg: "transparent"
note_border: "transparent"
example_color: "#6b7280"
example_bg: "transparent"
example_border: "transparent"
admonition_color: "#c8102e"
admonition_bg: "#fdf3f4"
admonition_border: "#c8102e"

# Reader chrome and cover
header_background: "linear-gradient(135deg, #094a86 0%, #0b5aa2 100%)"
cover_background: "linear-gradient(175deg, #073a6b 0%, #094a86 45%, #0b5aa2 100%)"
cover_after_bg: "height: 3px; background: #c8102e"
progress_bar_color: "#0b5aa2"
footer_border_color: "#0b5aa2"
cover_separator_color: "rgba(255,255,255,0.25)"

# Dark mode (Directives site dark palette)
dark_bg: "#15181d"
dark_bg_light: "#1a1e24"
dark_border: "#333a44"
dark_sidebar: "#1a1e24"
dark_text: "#e6e9ee"
dark_text_light: "#c2c8d0"
dark_text_muted: "#9aa3ae"
dark_primary_light: "#21303f"
dark_accent_light: "#21303f"
dark_note_bg: "transparent"
dark_example_bg: "transparent"
dark_admonition_bg: "#2a1d21"

# Publisher metadata
publishers:
  - "ISO"
publisher_name: "ISO"
logos_light:
  "ISO": "iso-logo.svg"

# Section ordering
preface_order:
  - foreword
  - introduction
  - abstract
  - clause
  - acknowledgements
  - executivesummary
toc_filter_types: []
