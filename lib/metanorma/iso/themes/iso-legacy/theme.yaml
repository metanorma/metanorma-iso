# Legacy ISO HTML theme: the previous default, kept so documents can still be
# rendered with the body typography of the legacy isodoc HTML output.
# Select it explicitly with Theme.load("iso-legacy"); the default ISO theme
# is the ISO Directives style in ../iso.
primary: "#b3000c"
accent: "#e3000f"
accent_deep: "#b3000c"
gradient: "linear-gradient(135deg, #8a0009 0%, #b3000c 50%, #e3000f 100%)"
primary_light: "#fef0f1"
accent_light: "#fde8ea"
warm: "#1a1a1a"
warm_light: "#f5f5f5"
header_background: "linear-gradient(135deg, #8a0009 0%, #b3000c 40%, #e3000f 100%)"
cover_background: "linear-gradient(175deg, #5a0006 0%, #8a0009 25%, #b3000c 50%, #e3000f 80%, #ff4d4d 100%)"
cover_before_bg: "background: radial-gradient(ellipse at 25% 20%, rgba(255,77,77,0.15) 0%, transparent 50%), radial-gradient(ellipse at 75% 80%, rgba(26,26,26,0.1) 0%, transparent 40%)"
cover_after_bg: "height: 3px; background: linear-gradient(90deg, transparent, #e3000f, #1a1a1a, transparent)"
progress_bar_color: "#e3000f"
note_border: "#e3000f"
note_bg: "#fde8ea"
note_color: "#e3000f"
example_border: "#b3000c"
example_bg: "#fef0f1"
example_color: "#b3000c"
admonition_border: "#1a1a1a"
admonition_color: "#1a1a1a"
footer_border_color: "#e3000f"
cover_separator_color: "rgba(227,0,15,0.25)"

# Publisher metadata
publishers:
  - "ISO"
publisher_name: "ISO"
logos_light:
  "ISO": "iso-logo.svg"

# Section ordering
preface_order:
  - foreword
  - introduction
  - abstract
  - clause
  - acknowledgements
  - executivesummary
toc_filter_types: []

# Reading-body typography follows the legacy default (non-alt) HTML output.
# Reader chrome and publisher cover branding retain the theme palette.
extra_css: |
  .main-section {
    font-family: Cambria, serif;
    font-weight: 300;
    line-height: 1.3;
  }
  :root:not([data-theme="dark"]) .main-section { color: #000; }
  .main-section p { margin: 1em 0; }
  .main-section h1, .main-section h2, .main-section h3,
  .main-section h4, .main-section h5, .main-section h6 {
    font-family: Cambria, serif;
    font-weight: 700;
    line-height: 1.2;
    color: inherit;
    margin: 2em 0 1em;
    padding: 0;
    border: 0;
    letter-spacing: normal;
  }
  .main-section h1 { font-size: 1.5em; }
  .main-section h2 { font-size: 1.2em; }
  .main-section h1::after { content: none; }
