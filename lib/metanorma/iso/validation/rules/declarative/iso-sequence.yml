    params: [".", "Prefatory material must be followed by (clause) Scope"]
    target: "/m:metanorma/v:sequence/v:item[2][not(@kind=\"introduction\" or @kind=\"scope\")]"
  - id: iso.sequence.after-introduction
    code: "ISO_28"
    context: "/m:metanorma/v:sequence"
