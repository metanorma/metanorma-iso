    check: "iso.model_forbidden"
    params: [".", "Initial section must be (content) Foreword"]
    target: "/m:metanorma/v:sequence/v:item[1][not(@kind=\"foreword\")]"
  - id: iso.sequence.prefatory
    code: "ISO_28"
    context: "/m:metanorma/v:sequence"
