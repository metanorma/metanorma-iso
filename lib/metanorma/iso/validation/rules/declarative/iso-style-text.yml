# Declarative text_pattern forms of simple ISO prose-scan style rules
# (metanorma-iso#1732, batches 1 and 2). SHADOW MODE: this ruleset is deliberately
# not listed in iso-catalog.yml, so nothing here runs during validation. The
# retained StyleXxxRule classes stay the runtime implementation; parity specs
# (spec/metanorma/validation/text_pattern_shadow_parity_spec.rb) run these rules
# beside the classes and require the same codes, paragraphs and messages.
# The finding is on the paragraph; the legacy rule reports on its parent.
# Scope matches the retained classes: they walk only model nodes that declare
# paragraphs, so each rule's context is a paragraph whose parent is one of those
# containers (not notes, table cells, definition-list items, term notes, figure
# notes or reference sections).
schema: metanorma-validation-rules/1
namespaces:
  m: https://www.metanorma.org/ns/standoc
rules:
  # StyleAOrAnRule
  - id: iso.style.a-before-vowel-sound
    code: ISO_62
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\ba\s+(?:hour(?:ly)?|honest(?:ly)?|honesty|hono(?:u)?r(?:ed)?|heir)\b'
      flags: i
      message: "wrong article '%s' (use 'an' before a vowel sound)"
    params: [{value: message}]
  - id: iso.style.an-before-consonant-sound
    code: ISO_62
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\ban\s+(?:europeans?|one(?:[-—][a-z]+)?|users?|useful(?:ness)?|utilisation|utilization|unique|universities|university|union|united|uniform|uniformity|units?|eula)'
      flags: i
      message: "wrong article '%s' (use 'a' before a consonant sound)"
    params: [{value: message}]
  # StyleAbbrevPluralRule
  - id: iso.style.abbrev-plural
    code: ISO_64
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bMSSs\b'
      report: once
      message: "style: 'MSSs' (abbreviated terms are invariant — 'MSS' is not pluralized)"
    params: [{value: message}]
  # StyleAbbrevTablesOnlyRule
  - id: iso.style.abbrev-tables-only
    code: ISO_65
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(min|max|lab)\.'
      message: "style: '%s.' (write the word in full in text; abbreviations are for tables and figures)"
    params: [{value: message}]
  # StyleComplianceRule
  - id: iso.style.compliance
    code: ISO_76
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(compliance|compliant|non-compliance|noncompliance|non-compliant|noncompliant)\b'
      flags: i
      message: "style: '%s' (use 'conformity'/'conforming'; House Style reserves 'compliance' for legislation)"
    params: [{value: message}]
  # StyleFamilySuiteRule
  - id: iso.style.family-suite
    code: ISO_89
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(famil(?:y|ies) of standards?|suites? of standards?)\b'
      flags: i
      message: "style: '%s' (use 'documents on [subject] developed by [committee]')"
    params: [{value: message}]
  # StyleFormulaeRule
  - id: iso.style.formulae
    code: ISO_91
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bformulas\b'
      flags: i
      report: once
      message: "style: 'formulas' (House Style: use 'formulae' for all mathematical forms)"
    params: [{value: message}]
  # StyleImpreciseRefsRule
  - id: iso.style.imprecise-refs
    code: ISO_94
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(the following clauses?|the following sections?|the preceding clauses?|the preceding sections?|the figures? above|the tables? below)'
      flags: i
      message: "style: '%s' (cite the element by its identifier)"
    params: [{value: message}]
  # StyleInformativeNormativeRule
  - id: iso.style.informative-normative
    code: ISO_97
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(?:normative|informative)\s+(?:annex|clause|figure|table)\s+[A-Z0-9]'
      flags: i
      message: "style: '%s' (do not name the normative/informative status of a cross-referenced element; the verbal form of the requirement states it)"
    params: [{value: message}]
  # StyleInterlabRule
  - id: iso.style.interlab
    code: ISO_98
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(round robins?|ring tests?)\b'
      flags: i
      message: "style: '%s' (use 'interlaboratory comparison')"
    params: [{value: message}]
  # StyleNoNosRule
  - id: iso.style.no-nos
    code: ISO_104
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b[Nn]os\.(?=\s|$)'
      message: "style: '%s' (House Style: the plural of 'no.' is 'nos', without the full stop)"
    params: [{value: message}]
  # StyleOrdinalsRule
  - id: iso.style.ordinals
    code: ISO_106
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(firstly|secondly|thirdly)\b'
      flags: i
      message: "style: '%s' (use 'first', 'second', 'third')"
    params: [{value: message}]
  # StylePerCentRule
  - id: iso.style.per-cent
    code: ISO_109
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(percent)\b'
      flags: i
      message: "style: 'percent' (use 'per cent' as two words, or 'percentage')"
    params: [{value: message}]
  # StylePluralSTermRule
  - id: iso.style.plural-s
    code: ISO_110
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '(?<=\w)(\(\s*s\s*\))'
      message: "style: '%s' pluralization (use the plural, or 'one or more')"
    params: [{value: message}]
  # StyleSelfReferenceRule
  - id: iso.style.self-reference
    code: ISO_113
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(this International Standard|this Standard|this part of ISO)'
      flags: i
      message: "style: '%s' (use 'this document')"
    params: [{value: message}]
  # StyleUnitsRule
  - id: iso.style.percent-space
    code: ISO_116
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '([0-9])%'
      message: "no space before %: %s%"
    params: [{value: message}]
  # StyleAbbrevArticlesRule
  - id: iso.style.abbrev-articles
    code: ISO_63
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\ba\s+(?:GPS|UN|URN|ERP|HR|SQL|API|ISO|HTML|XML|RGB|RPG|SAP|PDF|JPG|RPM|RSA|SLA|UML|URL)\b'
      message: "wrong article '%s': this initialism is pronounced letter-wise — use 'an'"
    params: [{value: message}]
  # StyleAffectEffectRule
  - id: iso.style.effect-as-verb
    code: ISO_68
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\beffects?\s+the\s+(?:result|performance|value|measurement)\b'
      flags: i
      message: "style: '%s' (use 'affects': 'affect' is the verb of influence)"
    params: [{value: message}]
  - id: iso.style.affect-as-noun
    code: ISO_68
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(?:the|a|an)\s+affects?\b'
      flags: i
      message: "style: '%s' (use 'effect': 'effect' is the noun)"
    params: [{value: message}]
  # StyleAmbigWordsRule
  - id: iso.style.ambig-and-or
    code: ISO_69
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\band/or\b'
      flags: i
      report: once
      message: "style: and/or"
    params: [{value: message}]
  - id: iso.style.ambig-on-line
    code: ISO_69
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bon-line\b'
      flags: i
      report: once
      message: "style: on-line (use 'online')"
    params: [{value: message}]
  - id: iso.style.ambig-cyber-underscore
    code: ISO_69
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bcyber_security\b'
      flags: i
      report: once
      message: "style: cyber_security (use 'cybersecurity')"
    params: [{value: message}]
  - id: iso.style.ambig-cyber-security
    code: ISO_69
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bcyber-security\b'
      flags: i
      report: once
      message: "style: cyber-security (use 'cybersecurity')"
    params: [{value: message}]
  - id: iso.style.ambig-need
    code: ISO_69
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bneed\s+to\b'
      flags: i
      report: once
      message: "style: need to (use 'shall' or 'should')"
    params: [{value: message}]
  - id: iso.style.ambig-might
    code: ISO_69
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bmight\b'
      flags: i
      report: once
      message: "style: might (ambiguous modal verb)"
    params: [{value: message}]
  - id: iso.style.ambig-could
    code: ISO_69
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bcould\b'
      flags: i
      report: once
      message: "style: could (ambiguous modal verb)"
    params: [{value: message}]
  # StyleApostrophePluralsRule
  - id: iso.style.apostrophe-plural-digits
    code: ISO_70
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b\d{2,4}''s\b'
      message: "style: '%s' (do not form plurals with the apostrophe)"
    params: [{value: message}]
  - id: iso.style.apostrophe-plural-acronym
    code: ISO_70
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '(?:\b\d+|\b(?:two|three|four|five|six|seven|eight|nine|ten))\s+([A-Z]{2,}''s)\b'
      message: "style: '%s' (do not form plurals with the apostrophe)"
    params: [{value: message}]
  # StyleAssureEnsureRule
  - id: iso.style.assure-that
    code: ISO_71
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bassure[ds]?\s+that\b'
      flags: i
      message: "style: '%s' (use 'ensure that' for clauses)"
    params: [{value: message}]
  - id: iso.style.assured-noun
    code: ISO_71
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bassured\s+(?:data|quality|accuracy|results?|performance|values?|operation|compliance)\b'
      flags: i
      message: "style: '%s' (use 'ensure' for things)"
    params: [{value: message}]
  - id: iso.style.assure-object
    code: ISO_71
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bassure[ds]?\s+(?:the|a|an)\s+(?!(?:user|users|reader|readers|customer|customers|client|clients|person|persons|people|operator|operators|installer|installers|manufacturer|manufacturers|supplier|suppliers|purchaser|purchasers|buyer|buyers|owner|owners|everyone|anyone|somebody|staff|personnel|team|committees|committee|member|members|delegate|delegates|authority|authorities|regulator|regulators|public|consumer|consumers|subscriber|subscribers)\b)[a-z]+\b'
      flags: i
      message: "style: 'assure' with a thing as its object '%s' (use 'ensure')"
    params: [{value: message}]
  # StyleContractionsRule
  - id: iso.style.contractions
    code: ISO_77
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(it''s|that''s|there''s|here''s|what''s|who''s|let''s|he''s|she''s |i''m|you''re|we''re|they''re |aren''t|isn''t|wasn''t|weren''t|don''t|doesn''t|didn''t |can''t|won''t|wouldn''t|shouldn''t|couldn''t|mustn''t|needn''t |hasn''t|haven''t|hadn''t |i''ll|you''ll|he''ll|she''ll|it''ll|we''ll|they''ll |i''ve|you''ve|we''ve|they''ve |i''d|you''d|he''d|she''d|we''d|they''d |shan''t)\b'
      flags: ix
      message: "style: contraction '%s' (use the full form)"
    params: [{value: message}]
  # StyleCvNotRsdRule
  - id: iso.style.cv-not-rsd-words
    code: ISO_81
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(relative\ standard\ deviation)\b'
      flags: ix
      message: "style: '%s' (use 'coefficient of variation' (Cv))"
    params: [{value: message}]
  - id: iso.style.cv-not-rsd-acronym
    code: ISO_81
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b(RSD)\b'
      message: "style: '%s' (use 'coefficient of variation' (Cv))"
    params: [{value: message}]
  # StyleDateDurationRule
  - id: iso.style.date-duration-day-range
    code: ISO_82
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b\d{1,2}\s*[-–]\s*\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\b'
      flags: ix
      message: "date range: use 'to', e.g. '10 to 15 March', not '%s'"
    params: [{value: message}]
  - id: iso.style.date-duration-year-range
    code: ISO_82
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b\d{4}\s*[-–]\s*\d{4}\b'
      message: "year range: use 'to', e.g. '2020 to 2030', not '%s'"
    params: [{value: message}]
  - id: iso.style.date-duration-century-range
    code: ISO_82
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b\d{1,2}(?:st|nd|rd|th)\s*[-–]\s*\d{1,2}(?:st|nd|rd|th)\s+centur'
      flags: ix
      message: "century range: use 'to', e.g. 'the 18th to 19th centuries', not '%s'"
    params: [{value: message}]
  - id: iso.style.date-duration-century-digits
    code: ISO_82
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\bthe\s+\d{1,2}(?:st|nd|rd|th)\s+centur'
      flags: ix
      message: "century in words: write 'the twentieth century', not '%s century'"
    params: [{value: message}]
  # StyleDateFormatsRule
  - id: iso.style.date-format-day-first-ordinal
    code: ISO_83
    context: //m:p[parent::*[self::m:clause or self::m:annex or self::m:appendix or self::m:li or self::m:admonition or self::m:example or self::m:quote or self::m:definitions or self::m:foreword or self::m:introduction or self::m:abstract]]
    check: text_pattern
    args:
      pattern: '\b\d{1,2}(?:st|nd|rd|th)\s+(?:of\s+)?(?:January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\b'
      flags: ix
      message: "ordinal date suffix: write '31 October 2026', not '%s'"
    params: [{value: message}]
  - id: iso.style.date-format-month-first-ordinal
    code: ISO_83
